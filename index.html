<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rummy Family — Game Viewer</title>
<style>
:root{
  --red-bg:#fdecea; --red-border:#e57373; --red-head:#c62828;
  --green-bg:#e8f5e9; --green-border:#81c784; --green-head:#2e7d32;
  --blue-bg:#e3f2fd; --blue-border:#64b5f6; --blue-head:#1565c0;
  --bg:#f4f5f7; --card-bg:#ffffff; --text:#1c1c1e; --muted:#6b7280; --border:#d9dde3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161a; --card-bg:#1f2024; --text:#f0f0f2; --muted:#9aa0a8; --border:#33353a;
    --red-bg:#3a1f1f; --green-bg:#1c3324; --blue-bg:#1c2b3a;
  }
}
:root[data-theme="dark"]{
  --bg:#15161a; --card-bg:#1f2024; --text:#f0f0f2; --muted:#9aa0a8; --border:#33353a;
  --red-bg:#3a1f1f; --green-bg:#1c3324; --blue-bg:#1c2b3a;
}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
*{box-sizing:border-box;}
.wrap{max-width:900px;margin:0 auto;padding:20px 14px 40px;}
h1{font-size:1.4rem;text-align:center;margin:6px 0 2px;}
.sub{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:18px;}
.box{border-radius:14px;border:2px solid; padding:14px 14px 18px; margin-bottom:20px; overflow-x:auto;}
.box h2{margin:0 0 10px;font-size:1.05rem;}
.box.blue{background:var(--blue-bg);border-color:var(--blue-border);}
.box.blue h2{color:var(--blue-head);}
.box.green{background:var(--green-bg);border-color:var(--green-border);}
.box.green h2{color:var(--green-head);}
.box.red{background:var(--red-bg);border-color:var(--red-border);}
.box.red h2{color:var(--red-head);}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:.85rem;}
th,td{border:1px solid var(--border);padding:6px 8px;text-align:center;white-space:nowrap;}
th{background:rgba(0,0,0,.04);}
input[type=text],input[type=number]{width:64px;padding:4px;border:1px solid var(--border);border-radius:6px;background:var(--card-bg);color:var(--text);font-size:.85rem;text-align:center;}
input[type=text]{width:84px;font-weight:600;}
.total-row td{font-weight:700;background:rgba(0,0,0,.05);}
.controls{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;}
button{border:none;border-radius:8px;padding:7px 12px;font-size:.8rem;font-weight:600;cursor:pointer;background:var(--card-bg);border:1px solid var(--border);color:var(--text);}
button:hover{filter:brightness(0.95);}
ol.rank{list-style:none;margin:0;padding:0;}
ol.rank li{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:10px;background:var(--card-bg);margin-bottom:7px;font-weight:600;}
ol.rank li .medal{font-size:1.1rem;margin-right:8px;}
ol.rank li .score{color:var(--blue-head);}
.note{font-size:.75rem;color:var(--muted);margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🃏 Rummy Family — Game Viewer</h1>
  <div class="sub">Round 1 &amp; the last round are auto-doubled — same formula as the sheet</div>

  <!-- BOX 1: RANK (blue) -->
  <div class="box blue">
    <h2>🏆 Box 1 — RANK</h2>
    <ol class="rank" id="rankList"></ol>
    <div class="note">Sorted lowest total first (lowest score wins in Rummy).</div>
  </div>

  <!-- BOX 2: Calculated scores (green) -->
  <div class="box green">
    <h2>✅ Box 2 — Calculated Scores (formula applied)</h2>
    <table id="calcTable"></table>
  </div>

  <!-- BOX 3: Raw score entry (red) -->
  <div class="box red">
    <h2>✏️ Box 3 — Raw Score Entry</h2>
    <table id="rawTable"></table>
    <div class="controls">
      <button onclick="addRound()">+ Add Round</button>
      <button onclick="removeRound()">− Remove Last Round</button>
      <button onclick="addPlayer()">+ Add Player</button>
      <button onclick="removePlayer()">− Remove Last Player</button>
    </div>
  </div>
</div>

<script>
let players = ["anne","macha","appa","anni","akka","me","ice","maha"];
let rounds = [
 [59,24,0,83,66,73,80,80],
 [75,18,15,24,0,96,80,80],
 [87,62,75,0,27,77,16,80],
 [41,2,13,15,0,17,69,80],
 [88,82,22,2,85,60,0,80],
 [65,93,12,84,13,11,0,0],
 [85,0,75,8,10,0,40,0]
];

function addRound(){ rounds.push(players.map(()=>0)); render(); }
function removeRound(){ if(rounds.length>1) rounds.pop(); render(); }
function addPlayer(){
  players.push("Player "+(players.length+1));
  rounds.forEach(r=>r.push(0));
  render();
}
function removePlayer(){
  if(players.length>2){
    players.pop();
    rounds.forEach(r=>r.pop());
    render();
  }
}
function setName(i,val){ players[i]=val||("Player "+(i+1)); renderCalcAndRank(); }
function setScore(r,p,val){ rounds[r][p]=parseFloat(val)||0; renderCalcAndRank(); }

function multiplier(r){ return (r===0 || r===rounds.length-1) ? 2 : 1; }

function renderRaw(){
  let html = "<tr><th>Round</th>"+players.map((n,i)=>`<th><input type="text" value="${n}" onchange="setName(${i},this.value)"></th>`).join("")+"</tr>";
  rounds.forEach((r,ri)=>{
    html += `<tr><td>${ri+1}${multiplier(ri)===2?" (x2)":""}</td>` +
      r.map((v,pi)=>`<td><input type="number" value="${v}" onchange="setScore(${ri},${pi},this.value)"></td>`).join("") +
      "</tr>";
  });
  document.getElementById("rawTable").innerHTML = html;
}

function computeTotals(){
  return players.map((_,pi)=> rounds.reduce((sum,r,ri)=> sum + r[pi]*multiplier(ri), 0));
}

function renderCalcAndRank(){
  const totals = computeTotals();

  // Box 2: calculated table
  let html = "<tr><th>Round</th>"+players.map(n=>`<th>${n}</th>`).join("")+"</tr>";
  rounds.forEach((r,ri)=>{
    html += `<tr><td>${ri+1}</td>` + r.map(v=>`<td>${v*multiplier(ri)}</td>`).join("") + "</tr>";
  });
  html += "<tr class='total-row'><td>Total</td>" + totals.map(t=>`<td>${t}</td>`).join("") + "</tr>";
  document.getElementById("calcTable").innerHTML = html;

  // Box 1: rank list (ascending total = best)
  const order = players.map((n,i)=>({n, t:totals[i]})).sort((a,b)=>a.t-b.t);
  const medals = ["🥇","🥈","🥉"];
  document.getElementById("rankList").innerHTML = order.map((o,i)=>
    `<li><span><span class="medal">${medals[i]||(i+1)+"."}</span>${o.n}</span><span class="score">${o.t}</span></li>`
  ).join("");
}

function render(){ renderRaw(); renderCalcAndRank(); }
render();
</script>
</body>
</html>
